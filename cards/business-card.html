<!doctype html><html><head><meta charset="utf-8"><title>Maneda Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<style>
@page{size:3.75in 2.25in;margin:0}
:root{--obsidian:#0D0D0D;--graphite:#2C2C2C;--stone:#7A7A7A;--mist:#B8B0A8;--ivory:#F5F2ED;--warm-white:#FAFAF8;--gold:#C4A882;--gold-dark:#A88B62}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#555}
.card{width:3.75in;height:2.25in;position:relative;overflow:hidden;page-break-after:always;break-after:page}
.front{background:var(--obsidian);display:flex;flex-direction:column;align-items:center;justify-content:center}
.front img{width:1.7in}
.front .rule{width:.4in;height:.5pt;background:var(--gold);margin:.17in 0 .12in}
.front .cap{font:500 4.6pt 'Montserrat';letter-spacing:.4em;text-transform:uppercase;color:var(--mist);padding-left:.4em}
.back{background:var(--warm-white);color:var(--obsidian)}
.safe{position:absolute;left:.375in;right:.375in;top:.375in;bottom:.375in}
.mark{position:absolute;right:0;top:0;height:.3in}
.name{position:absolute;left:0;top:0;font:300 17pt/1 'Cormorant Garamond';letter-spacing:.08em;color:var(--obsidian)}
.title{position:absolute;left:0;top:.3in;font:500 4.8pt 'Montserrat';letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dark)}
.tag{position:absolute;left:0;top:.72in;font:italic 300 8pt/1.3 'Cormorant Garamond';color:var(--stone)}
.hr{position:absolute;left:0;right:0;bottom:.5in;height:.5pt;background:#D9D3CB}
.contact{position:absolute;left:0;bottom:0;font:300 6pt/1.75 'Montserrat';letter-spacing:.05em;color:var(--graphite)}
.contact b{font-weight:500;font-size:4.2pt;letter-spacing:.3em;text-transform:uppercase;color:var(--stone);display:inline-block;width:.38in}
.loc{position:absolute;right:0;bottom:0;font:500 4.2pt 'Montserrat';letter-spacing:.3em;text-transform:uppercase;color:var(--stone);text-align:right;line-height:1.9}
</style></head><body>
<div class="card front"><img src="lockup-white.png"><div class="rule"></div><div class="cap">Architectural Design</div></div>
<div class="card back"><div class="safe">
<div class="name">Manolo Castaneda</div>
<div class="title">Architectural Designer</div>
<div class="tag">Architecture is intention made space.</div>
<img class="mark" src="mark-black.png">
<div class="hr"></div>
<div class="contact"><b>T</b>321-947-1674<br><b>E</b>manedastudios@gmail.com<br><b>W</b>manedastudios.com</div>
<div class="loc">Orlando, FL<br>@maneda.studios</div>
</div></div></body></html>
